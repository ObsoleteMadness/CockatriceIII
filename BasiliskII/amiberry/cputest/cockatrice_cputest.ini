[cputest]

; Quadra-class smoke preset for Cockatrice CI (generator self-check via CPU_TESTER).
cpu=68040
cpu_address_space=68020
cpu_no_unimplemented=0
fpu=
verbose=0
; Must be present (even empty) or the vendored CPU_TESTER's global
; feature_instruction_size_text stays NULL and it segfaults on strlen(NULL).
feature_instruction_size=
path=data/
feature_gzip=0
max_file_size=0
test_low_memory_start=0x0000
test_low_memory_end=0x8000
test_memory_start=0x00500000
test_memory_size=0x200000

; Focus on opcodes we recently fixed in production Amiberry (abcd/sbcd/chk2/cmp2).
[test=CockatriceSmoke]
enabled=1
cpu=68040
verbose=0
feature_undefined_ccr=1
feature_sr_mask=0x8000
test_rounds=1
mode=ABCD,SBCD,CHK2,CMP2
