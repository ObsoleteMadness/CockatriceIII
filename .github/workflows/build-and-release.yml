name: Build and Release Cockatrice III

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v0.6.0)'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (Apple Silicon) — native on macos-latest (arm64).
          # Intel hosted runners are deprecated; all three macOS artifacts
          # are produced from this Apple Silicon runner.
          - target: osx-arm
            os: macos-latest
            platform: osx
            arch: arm64
            build_dir: BasiliskII/OSX64
            artifact_name: CockatriceIII-osx-arm.dmg
            package_ext: dmg

          # macOS AMD64 (Intel x86_64) — clang -arch x86_64 + a native-built
          # x86_64 SDL prefix + cargo --target x86_64-apple-darwin.
          - target: osx-amd64
            os: macos-latest
            platform: osx
            arch: amd64
            build_dir: BasiliskII/OSX64
            artifact_name: CockatriceIII-osx-amd64.dmg
            package_ext: dmg

          # macOS universal (arm64 + x86_64 fat binary via lipo), same runner.
          - target: osx-universal
            os: macos-latest
            platform: osx
            arch: universal
            build_dir: BasiliskII/OSX64
            artifact_name: CockatriceIII-osx-universal.dmg
            package_ext: dmg

          # Windows x64 -- also builds the Amiberry/UAE JIT engine and the
          # m68k-rs Rust engine (mingw-w64-x86_64-rust provides cargo/rustc
          # already targeting x86_64-pc-windows-gnu, this env's host triple).
          - target: win32-x64
            os: windows-latest
            platform: windows
            arch: x64
            msystem: MINGW64
            pacman_packages: mingw-w64-x86_64-toolchain mingw-w64-x86_64-sdl12-compat mingw-w64-x86_64-rust make
            build_dir: BasiliskII/mingw
            artifact_name: CockatriceIII-win32-x64
            package_ext: zip

          # Windows x86 (32-bit) -- also builds the Amiberry/UAE interpreter
          # and JIT (its x86 JIT backend already covers CPU_i386, not just
          # CPU_x86_64; see BasiliskII/mingw/Makefile). MSYS2 dropped its own
          # mingw32 Rust package (msys2/MINGW-packages#23346), but its i686
          # GCC is DWARF2-exception-based -- matching what Rust's prebuilt
          # i686-pc-windows-gnu std expects -- so a rustup-installed
          # toolchain (see the "Install Rust" step below) should link fine
          # here even though it can't locally on this project's Homebrew
          # macOS cross toolchain, which is SJLJ-exception-based instead.
          - target: win32-x86
            os: windows-latest
            platform: windows
            arch: x86
            msystem: MINGW32
            pacman_packages: mingw-w64-i686-toolchain mingw-w64-i686-sdl12-compat curl make
            build_dir: BasiliskII/mingw
            artifact_name: CockatriceIII-win32-x86
            package_ext: zip

          # Windows ARM (ARM64) -- also builds the Amiberry/UAE JIT engine
          # and the m68k-rs Rust engine (mingw-w64-clang-aarch64-rust
          # targets aarch64-pc-windows-gnullvm, this env's host triple).
          - target: win32-arm
            os: windows-11-arm
            platform: windows
            arch: arm64
            msystem: CLANGARM64
            pacman_packages: mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-sdl12-compat mingw-w64-clang-aarch64-rust make
            build_dir: BasiliskII/mingw
            artifact_name: CockatriceIII-win32-arm
            package_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VER="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building Cockatrice III version: ${VER} for ${{ matrix.target }}"

      # --- macOS Setup & Build ---
      # Same script locally: scripts/ci-osx-build.sh arm64|amd64|universal
      - name: Build macOS (${{ matrix.target }})
        if: matrix.platform == 'osx'
        run: scripts/ci-osx-build.sh "${{ matrix.arch }}" "${{ steps.version.outputs.version }}"

      - name: Package macOS Distribution (.dmg)
        if: matrix.platform == 'osx'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_NAME="CockatriceIII-${VERSION}-${{ matrix.target }}"
          STAGING_DIR="dist_staging"
          rm -rf "${STAGING_DIR}" "${PKG_NAME}.dmg"
          mkdir -p "${STAGING_DIR}"

          # Copy built binary
          cp "${{ matrix.build_dir }}/CockatriceIII" "${STAGING_DIR}/"
          chmod +x "${STAGING_DIR}/CockatriceIII"

          # Copy built .app bundle (double-clickable distribution)
          cp -R "${{ matrix.build_dir }}/CockatriceIII.app" "${STAGING_DIR}/"

          # Copy root of ./dist (prefs, rom, xpram, archive) next to the
          # flat binary AND inside the .app bundle: CockatriceIII resolves
          # them relative to its own working directory, which on a
          # Finder/no-arg launch is chdir'd to the bundle root (see
          # setupWorkingDirectory() in sdlmain.m), not the binary's folder.
          # The ROM is the exception: `make bundle` already placed it in
          # Contents/Resources, which main_sdl.cpp falls back to, so don't
          # duplicate it at the bundle root too.
          for DEST in "${STAGING_DIR}" "${STAGING_DIR}/CockatriceIII.app"; do
            cp dist/CockatriceIII_Prefs "${DEST}/"
            [ -f dist/CockatriceIII_XPRAM ] && cp dist/CockatriceIII_XPRAM "${DEST}/"
            [ -d dist/archive ] && cp -r dist/archive "${DEST}/"
          done
          [ -f dist/Quadra800.rom ] && cp dist/Quadra800.rom "${STAGING_DIR}/"

          # Copy root documentation
          cp ChangeLog COPYING INSTALL README roms.txt TECH TODO "${STAGING_DIR}/"

          # Create DMG
          hdiutil create -volname "CockatriceIII" -srcfolder "${STAGING_DIR}" -ov -format UDZO "${PKG_NAME}.dmg"
          echo "PACKAGE_FILE=${PKG_NAME}.dmg" >> "$GITHUB_ENV"

      # --- Windows Setup & Build (MSYS2) ---
      - name: Set up MSYS2 (${{ matrix.msystem }})
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.pacman_packages }}

      # win32-x86 has no MSYS2-packaged Rust (msys2/MINGW-packages#23346), so
      # install one via rustup instead, defaulting its host to
      # i686-pc-windows-gnu so it's native to this MINGW32 shell and links
      # against its own (DWARF2-exception) gcc -- see the win32-x86 matrix
      # comment above for why that should succeed here.
      - name: Install Rust (win32-x86 only)
        if: matrix.platform == 'windows' && matrix.arch == 'x86'
        shell: msys2 {0}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --default-host i686-pc-windows-gnu --profile minimal
          # Use a native Windows path: $GITHUB_PATH is read by the runner
          # itself, not by this msys2 shell, so a bare /home/... entry
          # wouldn't resolve for the next step.
          cygpath -w "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Windows (${{ matrix.target }})
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          EXTRA_MAKE_VARS=""
          if [ "${{ matrix.arch }}" = "x86" ]; then
            EXTRA_MAKE_VARS="ENABLE_M68K_RS_CPU=1"
          fi
          make -C ${{ matrix.build_dir }} ARCH=${{ matrix.arch }} CC=cc CXX=c++ ${EXTRA_MAKE_VARS} -j${NUMBER_OF_PROCESSORS}
          echo "Imported DLLs:"
          objdump -p "${{ matrix.build_dir }}/CockatriceIII.exe" | awk '/DLL Name:/ {print $3}'

      - name: Stage Windows distribution
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          STAGING_DIR="dist_staging"
          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}"

          # Copy built executable
          cp "${{ matrix.build_dir }}/CockatriceIII.exe" "${STAGING_DIR}/"

          # Copy root of ./dist
          cp dist/CockatriceIII_Prefs "${STAGING_DIR}/"
          [ -f dist/CockatriceIII_XPRAM ] && cp dist/CockatriceIII_XPRAM "${STAGING_DIR}/"
          [ -f dist/Quadra800.rom ] && cp dist/Quadra800.rom "${STAGING_DIR}/"
          [ -d dist/archive ] && cp -r dist/archive "${STAGING_DIR}/"

          # Copy win32 support content (SDL.dll, dbghelp.dll, ethlist.exe, etc.) to root
          if [ -d dist/win32 ]; then
            cp -r dist/win32/* "${STAGING_DIR}/"
          elif [ -d dist/windows ]; then
            cp -r dist/windows/* "${STAGING_DIR}/"
          fi

          # Ship toolchain DLLs from the same MSYSTEM as the compiler so the
          # zip is self-contained and ARM64 cannot pick up an x64
          # libwinpthread/SDL from PATH (0xc000007b). sdl12-compat's SDL.dll
          # still needs SDL2.dll even when the exe only imports SDL.dll.
          BINDIR="$(dirname "$(command -v c++)")"
          for dll in SDL.dll SDL2.dll; do
            if [ -f "${BINDIR}/${dll}" ]; then
              cp "${BINDIR}/${dll}" "${STAGING_DIR}/"
            fi
          done
          for pass in 1 2 3; do
            for f in "${STAGING_DIR}"/*.exe "${STAGING_DIR}"/*.dll; do
              [ -f "$f" ] || continue
              objdump -p "$f" | awk '/DLL Name:/ {print $3}' | while IFS= read -r dll; do
                if [ -f "${BINDIR}/${dll}" ] && [ ! -f "${STAGING_DIR}/${dll}" ]; then
                  cp "${BINDIR}/${dll}" "${STAGING_DIR}/"
                fi
              done
            done
          done

          # Copy root documentation
          cp ChangeLog COPYING INSTALL README roms.txt TECH TODO "${STAGING_DIR}/"

          # Do not pre-zip: upload-artifact already wraps the folder in a zip.
          # Zipping here produced a zip-in-zip download (and .zip.zip from the
          # artifact name). GitHub Releases zip this folder in the release job.

      - name: Upload macOS artifact
        if: matrix.platform == 'osx'
        uses: actions/upload-artifact@v4
        with:
          name: CockatriceIII-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: ${{ env.PACKAGE_FILE }}
          if-no-files-found: error

      - name: Upload Windows artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: CockatriceIII-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: dist_staging/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag name
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Stage release assets
        run: |
          mkdir -p release_files
          find release_artifacts -name '*.dmg' -exec cp {} release_files/ \;
          for d in release_artifacts/*; do
            [ -d "$d" ] || continue
            base="$(basename "$d")"
            case "$base" in
              *win32-*)
                (cd "$d" && zip -r "$GITHUB_WORKSPACE/release_files/${base}.zip" .)
                ;;
            esac
          done
          ls -la release_files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Cockatrice III ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_files/*.dmg
            release_files/*.zip
