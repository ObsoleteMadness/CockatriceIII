name: Build and Release Cockatrice III

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v0.6.0)'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- macOS -------------------------------------------------------
          # Intel hosted runners are deprecated, so all three macOS artifacts
          # come off the Apple Silicon runner: the x86_64 slice is cross-built
          # against the committed Intel SDL prefix.
          - target: osx-arm
            os: macos-latest
            platform: osx
            arch: arm64
            package_ext: dmg

          - target: osx-amd64
            os: macos-latest
            platform: osx
            arch: amd64
            package_ext: dmg

          - target: osx-universal
            os: macos-latest
            platform: osx
            arch: universal
            package_ext: dmg

          # --- Windows -----------------------------------------------------
          # 32-bit x86 was dropped with the move to a 64-bit-only guest window.
          - target: win-x64
            os: windows-latest
            platform: windows
            arch: AMD64
            msystem: MINGW64
            pacman_packages: >-
              mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
              mingw-w64-x86_64-ninja mingw-w64-x86_64-sdl12-compat
              mingw-w64-x86_64-rust

          - target: win-arm64
            os: windows-11-arm
            platform: windows
            arch: ARM64
            msystem: CLANGARM64
            pacman_packages: >-
              mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-ninja mingw-w64-clang-aarch64-sdl12-compat
              mingw-w64-clang-aarch64-rust

          # --- Linux -------------------------------------------------------
          - target: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: AMD64

          - target: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: ARM64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VER="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building Cockatrice III ${VER} for ${{ matrix.target }}"

      # --- macOS ----------------------------------------------------------
      # Same script locally: scripts/ci-osx-build.sh arm64|amd64|universal
      - name: Build macOS (${{ matrix.target }})
        if: matrix.platform == 'osx'
        run: scripts/ci-osx-build.sh "${{ matrix.arch }}" "${{ steps.version.outputs.version }}"

      - name: Test macOS
        if: matrix.platform == 'osx' && matrix.arch == 'arm64'
        run: |
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ctest --test-dir build -L gate --output-on-failure
          # Engine accuracy is reported, not gated: see BasiliskII/tests/README.md
          ctest --test-dir build -L cpu --output-on-failure || true

      - name: Package macOS (.dmg)
        if: matrix.platform == 'osx'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_NAME="CockatriceIII-${VERSION}-${{ matrix.target }}"
          STAGING_DIR="dist_staging"
          rm -rf "${STAGING_DIR}" "${PKG_NAME}.dmg"
          mkdir -p "${STAGING_DIR}"

          cp build/CockatriceIII "${STAGING_DIR}/"
          chmod +x "${STAGING_DIR}/CockatriceIII"
          cp -R build/CockatriceIII.app "${STAGING_DIR}/"

          # CockatriceIII resolves prefs/xpram/archive relative to its own
          # working directory, which on a Finder launch is the bundle root (see
          # setupWorkingDirectory in platform/darwin/sdlmain.m) -- so they go
          # both next to the flat binary and inside the bundle. The ROM is the
          # exception: the bundle target already placed it logic-side in
          # Contents/Resources, which main_sdl.cpp falls back to.
          for DEST in "${STAGING_DIR}" "${STAGING_DIR}/CockatriceIII.app"; do
            cp dist/CockatriceIII_Prefs "${DEST}/"
            [ -f dist/CockatriceIII_XPRAM ] && cp dist/CockatriceIII_XPRAM "${DEST}/"
            [ -d dist/archive ] && cp -r dist/archive "${DEST}/"
          done
          [ -f dist/Quadra800.rom ] && cp dist/Quadra800.rom "${STAGING_DIR}/"

          cp ChangeLog COPYING INSTALL README roms.txt TECH TODO "${STAGING_DIR}/"

          hdiutil create -volname "CockatriceIII" -srcfolder "${STAGING_DIR}" \
            -ov -format UDZO "${PKG_NAME}.dmg"
          echo "PACKAGE_FILE=${PKG_NAME}.dmg" >> "$GITHUB_ENV"

      # --- Windows (MSYS2) -------------------------------------------------
      - name: Set up MSYS2 (${{ matrix.msystem }})
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.pacman_packages }}

      - name: Build Windows (${{ matrix.target }})
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"${NUMBER_OF_PROCESSORS}"
          echo "Imported DLLs:"
          objdump -p build/BasiliskII/CockatriceIII.exe | awk '/DLL Name:/ {print $3}'

      - name: Test Windows
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          ctest --test-dir build -L gate --output-on-failure
          ctest --test-dir build -L cpu --output-on-failure || true

      - name: Stage Windows distribution
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          STAGING_DIR="dist_staging"
          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}"

          cp build/BasiliskII/CockatriceIII.exe "${STAGING_DIR}/"
          cp dist/CockatriceIII_Prefs "${STAGING_DIR}/"
          [ -f dist/CockatriceIII_XPRAM ] && cp dist/CockatriceIII_XPRAM "${STAGING_DIR}/"
          [ -f dist/Quadra800.rom ] && cp dist/Quadra800.rom "${STAGING_DIR}/"
          [ -d dist/archive ] && cp -r dist/archive "${STAGING_DIR}/"
          if [ -d dist/win32 ]; then cp -r dist/win32/* "${STAGING_DIR}/"; fi

          # Ship toolchain DLLs from the same MSYSTEM as the compiler so the zip
          # is self-contained and ARM64 cannot pick up an x64 libwinpthread or
          # SDL from PATH (0xc000007b). sdl12-compat's SDL.dll needs SDL2.dll
          # even though the exe only imports SDL.dll.
          BINDIR="$(dirname "$(command -v c++)")"
          for dll in SDL.dll SDL2.dll; do
            [ -f "${BINDIR}/${dll}" ] && cp "${BINDIR}/${dll}" "${STAGING_DIR}/"
          done
          for pass in 1 2 3; do
            for f in "${STAGING_DIR}"/*.exe "${STAGING_DIR}"/*.dll; do
              [ -f "$f" ] || continue
              objdump -p "$f" | awk '/DLL Name:/ {print $3}' | while IFS= read -r dll; do
                if [ -f "${BINDIR}/${dll}" ] && [ ! -f "${STAGING_DIR}/${dll}" ]; then
                  cp "${BINDIR}/${dll}" "${STAGING_DIR}/"
                fi
              done
            done
          done

          cp ChangeLog COPYING INSTALL README roms.txt TECH TODO "${STAGING_DIR}/"

      # --- Linux -----------------------------------------------------------
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # sdl12-compat provides the SDL 1.2 API on top of SDL2; libpcap-dev is
          # needed for its headers only -- the library itself is dlopen'd at
          # runtime (see SDL/sdl_pcap.cpp).
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential \
            libsdl1.2-compat-dev libpcap-dev

      - name: Build Linux (${{ matrix.target }})
        if: matrix.platform == 'linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Test Linux
        if: matrix.platform == 'linux'
        run: |
          ctest --test-dir build -L gate --output-on-failure
          ctest --test-dir build -L cpu --output-on-failure || true

      - name: Stage Linux distribution
        if: matrix.platform == 'linux'
        run: |
          STAGING_DIR="dist_staging"
          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}"
          cp build/BasiliskII/CockatriceIII "${STAGING_DIR}/"
          cp dist/CockatriceIII_Prefs "${STAGING_DIR}/"
          [ -f dist/CockatriceIII_XPRAM ] && cp dist/CockatriceIII_XPRAM "${STAGING_DIR}/"
          [ -f dist/Quadra800.rom ] && cp dist/Quadra800.rom "${STAGING_DIR}/"
          [ -d dist/archive ] && cp -r dist/archive "${STAGING_DIR}/"
          cp ChangeLog COPYING INSTALL README roms.txt TECH TODO "${STAGING_DIR}/"

      # --- Artifacts -------------------------------------------------------
      - name: Upload macOS artifact
        if: matrix.platform == 'osx'
        uses: actions/upload-artifact@v4
        with:
          name: CockatriceIII-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: ${{ env.PACKAGE_FILE }}
          if-no-files-found: error

      - name: Upload artifact (Windows/Linux)
        if: matrix.platform != 'osx'
        uses: actions/upload-artifact@v4
        with:
          name: CockatriceIII-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: dist_staging/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag name
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Stage release assets
        run: |
          mkdir -p release_files
          find release_artifacts -name '*.dmg' -exec cp {} release_files/ \;
          for d in release_artifacts/*; do
            [ -d "$d" ] || continue
            base="$(basename "$d")"
            case "$base" in
              *win-*|*linux-*)
                (cd "$d" && zip -r "$GITHUB_WORKSPACE/release_files/${base}.zip" .)
                ;;
            esac
          done
          ls -la release_files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Cockatrice III ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_files/*.dmg
            release_files/*.zip
